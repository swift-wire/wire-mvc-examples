name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Every runtime is now proposal-native (Swift 6.4): each serves the shared, framework-free
# `Controllers` — SwiftHttpServerExample directly on the swift-http-api-proposal server, Hummingbird
# and Vapor on their `ServerTransport` via the WireMVCServerTransport adapter (the wire-mvc
# `ServerTransport` trait, enabled in their manifests). So CI runs entirely on the Swift 6.4 nightly
# container (SwiftyLab/setup-swift installs released toolchains only). Each package is its own SPM
# package (isolated dependency tree), so the jobs matrix over them, each built/linted in its directory.
jobs:
  Build:
    name: ${{ matrix.package }} / Swift 6.4 nightly
    strategy:
      fail-fast: false
      matrix:
        package: [Controllers, HummingbirdExample, VaporExample, SwiftHttpServerExample]
    runs-on: ubuntu-24.04
    container: swiftlang/swift:nightly-6.4.x-noble
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: apt-get update && apt-get install -y libssl-dev libsqlite3-dev
      - name: Build
        working-directory: ${{ matrix.package }}
        run: swift build

  EndToEnd:
    name: End-to-end / ${{ matrix.example }} / Swift 6.4 nightly
    # Hummingbird (in-memory SQLite) and SwiftHttpServerExample (in-memory) drive every route in-process
    # with no external infra, so they run in the container. VaporExample needs Docker (a real MongoDB
    # via swift-local-containers), which a container job can't reach — it gets its own job below, on a
    # plain runner with the toolchain installed via Swiftly so native Docker is available.
    strategy:
      fail-fast: false
      matrix:
        example: [HummingbirdExample, SwiftHttpServerExample]
    runs-on: ubuntu-24.04
    container: swiftlang/swift:nightly-6.4.x-noble
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: apt-get update && apt-get install -y libssl-dev libsqlite3-dev
      - name: Run
        # Drives every route via the framework's test idiom: Hummingbird bridges the proposal-native
        # controllers onto its Router via WireMVCServerTransport (HummingbirdTesting + SQLite);
        # SwiftHttpServerExample serves them on NIOHTTPServer (in-process HTTP + in-memory backend).
        working-directory: ${{ matrix.example }}
        run: swift test

  VaporIntegration:
    name: End-to-end / VaporExample (MongoDB via Docker) / Swift 6.4 nightly
    # Vapor's integration test provisions a real MongoDB via swift-local-containers, so it needs
    # Docker — native on the GitHub ubuntu runner, but unreachable from a container job. So this one
    # job installs the 6.4 nightly toolchain with Swiftly (rather than the container), keeping Docker
    # native. The snapshot is pinned here because .swift-version is gitignored (not in the checkout);
    # when it's garbage-collected upstream, bump it — the container jobs above already track latest.
    env:
      SWIFT_SNAPSHOT: "6.4.x-snapshot-2026-07-06"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        # libcurl4-openssl-dev is required by the toolchain itself (Foundation networking on Linux);
        # install it before Swiftly installs the toolchain, or Swiftly's post-install check fails.
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libsqlite3-dev libcurl4-openssl-dev
      - name: Install Swiftly + the Swift 6.4 nightly toolchain
        run: |
          curl -L "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz" | tar zxf -
          ./swiftly init --assume-yes --skip-install
          echo "$HOME/.local/share/swiftly/bin" >> "$GITHUB_PATH"
          "$HOME/.local/share/swiftly/bin/swiftly" install "$SWIFT_SNAPSHOT" --use --assume-yes
      - name: Run integration test (real MongoDB via swift-local-containers)
        # Docker is preinstalled on the ubuntu runner; swift-local-containers pulls mongo:7, the
        # graph's @Teardown disconnects it on shutdown, and VaporTesting drives every route. Run via
        # `swiftly run` (Swiftly stays unlinked, so there's no `swift` shim on PATH to rely on).
        working-directory: VaporExample
        run: swiftly run swift test

  SwiftFormat:
    name: swift-format / ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        package: [Controllers, HummingbirdExample, VaporExample, SwiftHttpServerExample]
    runs-on: ubuntu-24.04
    container: swiftlang/swift:nightly-6.4.x-noble
    steps:
      - uses: actions/checkout@v6
      - name: Run swift-format
        # From the 6.4 toolchain so it parses the proposal's ~Copyable / consuming sending syntax.
        working-directory: ${{ matrix.package }}
        run: swift-format format --recursive --in-place .
      - name: Check for formatting differences
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code

  SwiftLint:
    name: SwiftLint 0.63.2 / ${{ matrix.package }}
    # `swiftlint lint` is SwiftSyntax-based and parses the 6.4 sources, so it needs no toolchain and
    # runs on a plain runner over every package.
    strategy:
      fail-fast: false
      matrix:
        package: [Controllers, HummingbirdExample, VaporExample, SwiftHttpServerExample]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install SwiftLint
        # The prebuilt Linux binary needs the GLIBC on ubuntu-24.04+.
        run: |
          curl -sL https://github.com/realm/SwiftLint/releases/download/0.63.2/swiftlint_linux_amd64.zip -o swiftlint.zip
          unzip -o swiftlint.zip -d /usr/local/bin
          chmod +x /usr/local/bin/swiftlint
      - name: SwiftLint
        working-directory: ${{ matrix.package }}
        run: swiftlint lint --quiet
