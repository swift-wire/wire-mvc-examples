name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Every runtime is now proposal-native (Swift 6.4): each serves the shared, framework-free
# `Controllers` — SwiftHttpServerExample directly on the swift-http-api-proposal server, Hummingbird
# and Vapor on their `ServerTransport` via the WireMVCServerTransport adapter (the wire-mvc
# `ServerTransport` trait, enabled in their manifests). So CI runs entirely on the Swift 6.4 toolchain
# pinned in `.swift-version`, installed through swift-wire/setup-swift. Each package is its own SPM
# package (isolated dependency tree), so the jobs matrix over them, each built/linted in its directory.
jobs:
  Build:
    name: ${{ matrix.package }} / Swift 6.4 (pinned)
    strategy:
      fail-fast: false
      matrix:
        package: [Controllers, HTMLForm, YAMLConfig, OpenAPISpec, HummingbirdExample, VaporExample, SwiftHttpServerExample]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: swift-wire/setup-swift@v1
      - name: Build
        working-directory: ${{ matrix.package }}
        run: swift build
      # `Controllers` is the one package with tests that need no container: the multipart parser is pure
      # logic and its suite drives the same input at every chunk size, and the job worker's shutdown drain
      # is a property of a `ServiceGroup`, which a unit test can run. Every other package's tests either
      # need a datastore (the Integration job) or a server (the runtimes' own suites).
      - name: Unit tests
        if: matrix.package == 'Controllers'
        working-directory: ${{ matrix.package }}
        run: swift test

  Integration:
    name: End-to-end / ${{ matrix.example }} (Docker) / Swift 6.4 (pinned)
    # Every runtime's integration test provisions a real datastore via swift-local-containers
    # (Hummingbird → Valkey, Vapor → MongoDB, SwiftHttpServerExample → CouchDB), so they need Docker —
    # native on the GitHub ubuntu runner, but unreachable from a container job. So this job installs the
    # pinned 6.4 toolchain with swift-wire/setup-swift (rather than a container), keeping Docker native,
    # reading the toolchain from `.swift-version` like every other job.
    strategy:
      fail-fast: false
      matrix:
        example: [HummingbirdExample, VaporExample, SwiftHttpServerExample]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: swift-wire/setup-swift@v1
      - name: Run integration test (real datastore via swift-local-containers)
        # Docker is preinstalled on the ubuntu runner; swift-local-containers pulls the image
        # (valkey/valkey:8 / mongo:7 / couchdb:3) and drives every route.
        working-directory: ${{ matrix.example }}
        run: swift test

  SwiftFormat:
    name: swift-format / ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        package: [Controllers, HTMLForm, YAMLConfig, OpenAPISpec, HummingbirdExample, VaporExample, SwiftHttpServerExample]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: swift-wire/setup-swift@v1
      - name: Run swift-format
        # From the 6.4 toolchain so it parses the proposal's ~Copyable / consuming sending syntax.
        working-directory: ${{ matrix.package }}
        run: swift-format format --recursive --in-place .
      - name: Check for formatting differences
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code

  SwiftLint:
    name: SwiftLint 0.63.2 / ${{ matrix.package }}
    # `swiftlint lint` is SwiftSyntax-based and parses the 6.4 sources, so it needs no toolchain and
    # runs on a plain runner over every package.
    strategy:
      fail-fast: false
      matrix:
        package: [Controllers, HTMLForm, YAMLConfig, OpenAPISpec, HummingbirdExample, VaporExample, SwiftHttpServerExample]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install SwiftLint
        # The prebuilt Linux binary needs the GLIBC on ubuntu-24.04+.
        run: |
          curl -sL https://github.com/realm/SwiftLint/releases/download/0.63.2/swiftlint_linux_amd64.zip -o swiftlint.zip
          unzip -o swiftlint.zip -d /usr/local/bin
          chmod +x /usr/local/bin/swiftlint
      - name: SwiftLint
        working-directory: ${{ matrix.package }}
        run: swiftlint lint --quiet

  StaticLinuxSDK:
    name: Static Linux SDK / ${{ matrix.package }} (cross-compile to aarch64-musl)
    strategy:
      fail-fast: false
      matrix:
        # Every package but `SwiftHttpServerExample`: it serves on NIOHTTPServer, and swift-http-server
        # does not compile for the musl target on 6.4.0 (`NIOHTTPServer+HTTP1_1.swift` fails region
        # isolation for aarch64-swift-linux-musl while building for glibc and macOS). Upstream's to fix;
        # add it back here when it does.
        package: [Controllers, HTMLForm, YAMLConfig, OpenAPISpec, HummingbirdExample, VaporExample]
    runs-on: ubuntu-24.04
    # The image and the SDK bundle must be the same Swift release: an SDK only installs against the
    # toolchain it was built for, so these two literals move together — and together with
    # `.swift-version`, since the cross-compile should check the toolchain the package is developed on.
    container:
      image: swift:6.4.0-noble
    steps:
      - uses: actions/checkout@v6
      - name: Install Static Linux SDK
        run: swift sdk install https://download.swift.org/swift-6.4.0-release/static-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz --checksum 47d2fd89eebfdf9eb4d536b6710414297f755c17926cdebc4742c08982b40a9e
      - name: Cross-compile for ARM64 Linux
        working-directory: ${{ matrix.package }}
        run: swift build -c release --swift-sdk aarch64-swift-linux-musl

  Coverage:
    name: Coverage / Swift (pinned)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: swift-wire/setup-swift@v1
      - name: Run tests with coverage
        # `Controllers` is the one package with a unit suite that needs no datastore; the runtime
        # packages' suites are the Docker-backed Integration job above, and measure the runtimes'
        # glue rather than the controllers.
        working-directory: Controllers
        run: swift test --enable-code-coverage --xunit-output test-results.xml
      - name: Convert to LCOV
        working-directory: Controllers
        # 6.4's build system emits one `<Target>-test-runner` executable and a `<Target>.so` per test
        # module rather than the single `.xctest` binary earlier toolchains linked. Every one of them
        # carries instrumented code, so llvm-cov is handed all of them; the `.xctest` glob keeps the
        # older layout working should a job ever run on one.
        run: |
          BIN_PATH=$(swift build --show-bin-path)
          PROFDATA=$(find .build -name 'default.profdata' -path '*/codecov/*' | head -1)
          objects=()
          for f in "$BIN_PATH"/*-test-runner "$BIN_PATH"/*.so "$BIN_PATH"/*.xctest; do
            [ -f "$f" ] && objects+=(-object "$f")
          done
          llvm-cov export \
            -format=lcov \
            -instr-profile="$PROFDATA" \
            "${objects[@]}" \
            -ignore-filename-regex=".build|Tests" \
            > coverage.lcov
      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: Controllers/coverage.lcov
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results
        uses: codecov/codecov-action@v6
        if: always()
        with:
          files: Controllers/test-results.xml
          report_type: test_results
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  LicenceHeaders:
    name: Licence headers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # Pure git and shell, so this gate needs no toolchain and answers in seconds. It is a
      # separate job rather than a step on an existing one because a missing header is not a
      # build error: nothing else in the toolchain looks, so without this the omission is silent.
      - name: Check SPDX headers
        run: ./Scripts/check-license-headers.sh
