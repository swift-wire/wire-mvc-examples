name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Each runtime is its own Swift package (isolated dependency tree), so CI runs a matrix over the
# packages, each built/linted in its own directory. The examples split across two toolchains:
#   - Swift 6.3 (released, via SwiftyLab): the ServerTransport-era runtime still on ControllersLegacy —
#     Vapor — plus ControllersLegacy itself.
#   - Swift 6.4 (nightly container): the proposal-native runtimes — SwiftHttpServerExample (on the
#     swift-http-api-proposal server) and Hummingbird (on the proposal-native controllers via the
#     WireMVCServerTransport adapter, ServerTransport trait enabled in its manifest) — plus the
#     proposal-native Controllers package.
# SwiftLint's `lint` parses both, so it runs over every package on a plain runner. (Its `unused_import`
# analyzer runs only on the 6.3 packages — its SourceKit can't parse the 6.4 build log's flags; the
# compiler's InternalImportsByDefault covers unused imports on 6.4.)
jobs:
  Build63:
    name: ${{ matrix.package }} / Swift 6.3
    strategy:
      fail-fast: false
      matrix:
        package: [ControllersLegacy, VaporExample]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: SwiftyLab/setup-swift@v1
        with:
          swift-version: "6.3.3"
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libsqlite3-dev curl unzip
      - name: Build
        working-directory: ${{ matrix.package }}
        run: swift build -c release -Xswiftc -strict-concurrency=complete
      - name: Build (verbose, for SwiftLint)
        working-directory: ${{ matrix.package }}
        run: swift build -v > build.log 2>&1
      - name: Install SwiftLint
        run: |
          curl -sL https://github.com/realm/SwiftLint/releases/download/0.63.2/swiftlint_linux_amd64.zip -o swiftlint.zip
          unzip -o swiftlint.zip -d /usr/local/bin
          chmod +x /usr/local/bin/swiftlint
      - name: SwiftLint unused imports
        working-directory: ${{ matrix.package }}
        run: swiftlint analyze --strict --quiet --compiler-log-path build.log

  Build64:
    name: ${{ matrix.package }} / Swift 6.4 nightly
    # The proposal-native packages are swift-tools-version 6.4 and depend on the (still pre-release)
    # swift-http-api-proposal + swift-http-server, so they build only on the 6.4 toolchain — via the
    # nightly container, since SwiftyLab/setup-swift installs released toolchains only. Hummingbird
    # enables the wire-mvc `ServerTransport` trait in its manifest, so the adapter is built here too.
    strategy:
      fail-fast: false
      matrix:
        package: [Controllers, HummingbirdExample, SwiftHttpServerExample]
    runs-on: ubuntu-24.04
    container: swiftlang/swift:nightly-6.4.x-noble
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: apt-get update && apt-get install -y libssl-dev libsqlite3-dev
      - name: Build
        working-directory: ${{ matrix.package }}
        run: swift build

  EndToEnd63:
    name: End-to-end / ${{ matrix.example }}
    strategy:
      fail-fast: false
      matrix:
        example: [VaporExample]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: SwiftyLab/setup-swift@v1
        with:
          swift-version: "6.3.3"
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libsqlite3-dev
      - name: Run
        # buildApplication/configure bootstraps the graph (collating the shared ControllersLegacy
        # package across the package boundary), applies the WireMVC controllers onto the runtime's
        # transport alongside a native route, and drives every route. Vapor provisions a throwaway
        # Postgres via swift-local-containers (Docker is preinstalled on the runner).
        working-directory: ${{ matrix.example }}
        run: swift test

  EndToEnd64:
    name: End-to-end / ${{ matrix.example }} / Swift 6.4 nightly
    strategy:
      fail-fast: false
      matrix:
        example: [HummingbirdExample, SwiftHttpServerExample]
    runs-on: ubuntu-24.04
    container: swiftlang/swift:nightly-6.4.x-noble
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: apt-get update && apt-get install -y libssl-dev libsqlite3-dev
      - name: Run
        # Drives every route via the framework's test idiom: Hummingbird bridges the proposal-native
        # controllers onto its Router via WireMVCServerTransport (HummingbirdTesting + SQLite);
        # SwiftHttpServerExample serves them on NIOHTTPServer (in-process HTTP + in-memory backend).
        working-directory: ${{ matrix.example }}
        run: swift test

  SwiftFormat63:
    name: swift-format / ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        package: [ControllersLegacy, VaporExample]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: SwiftyLab/setup-swift@v1
        with:
          swift-version: "6.3.3"
      - name: Run swift-format
        working-directory: ${{ matrix.package }}
        run: swift-format format --recursive --in-place .
      - name: Check for formatting differences
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code

  SwiftFormat64:
    name: swift-format (6.4) / ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        package: [Controllers, HummingbirdExample, SwiftHttpServerExample]
    runs-on: ubuntu-24.04
    container: swiftlang/swift:nightly-6.4.x-noble
    steps:
      - uses: actions/checkout@v6
      - name: Run swift-format
        # From the 6.4 toolchain so it parses the proposal's ~Copyable / consuming sending syntax.
        working-directory: ${{ matrix.package }}
        run: swift-format format --recursive --in-place .
      - name: Check for formatting differences
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code

  SwiftLint:
    name: SwiftLint 0.63.2 / ${{ matrix.package }}
    # `swiftlint lint` is SwiftSyntax-based and parses both the 6.3 and 6.4 sources, so it needs no
    # toolchain and runs on a plain runner over every package.
    strategy:
      fail-fast: false
      matrix:
        package: [ControllersLegacy, VaporExample, Controllers, HummingbirdExample, SwiftHttpServerExample]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install SwiftLint
        # The prebuilt Linux binary needs the GLIBC on ubuntu-24.04+.
        run: |
          curl -sL https://github.com/realm/SwiftLint/releases/download/0.63.2/swiftlint_linux_amd64.zip -o swiftlint.zip
          unzip -o swiftlint.zip -d /usr/local/bin
          chmod +x /usr/local/bin/swiftlint
      - name: SwiftLint
        working-directory: ${{ matrix.package }}
        run: swiftlint lint --quiet
